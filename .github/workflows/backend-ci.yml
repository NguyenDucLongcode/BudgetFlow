name: Backend CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    name: Build & Lint Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:123456@localhost:5432/db_postgres?schema=public
        run: npx prisma generate

      - name: Build NestJS application
        env:
          DATABASE_URL: postgresql://postgres:123456@localhost:5432/db_postgres?schema=public
          JWT_ACCESS_SECRET: ci-dummy-access-secret
          JWT_REFRESH_SECRET: ci-dummy-refresh-secret
        run: npm run build

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true
